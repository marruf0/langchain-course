[project]
name = "langchain-course"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { email = "sergiomarrufog@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "langchain>=1.5.1",
    "langchain-ollama>=1.2.0",
    "langchain-openai>=1.8.2",
    "langchain-tavily>=0.2.18",
    "python-dotenv>=1.2.4",
    "tavily-python>=0.8.5",
]

[project.scripts]
langchain-course = "langchain_course:main"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"
